[project]
name = "calypso-puck"
version = "0.1.0"
description = "Calypso⁻¹ puck: capture, VAD, sound tags, offline queue, uploader (Raspberry Pi)"
requires-python = ">=3.11"
dependencies = [
  "sounddevice>=0.4",
  "webrtcvad>=2.0.10",
  "httpx>=0.27",
  "numpy>=1.26",
]

[project.optional-dependencies]
cpu = ["tflite-runtime"]

[dependency-groups]
dev = ["pytest>=8"]
