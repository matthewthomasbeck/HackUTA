[project]
name = "calypso-backend"
version = "0.1.0"
description = "Calypso⁻¹ backend: memory bank, identity, day builder, recall"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "anthropic>=0.40",
  "httpx>=0.27",
  "numpy>=1.26",
]

[project.optional-dependencies]
ml = ["speechbrain", "insightface", "onnxruntime", "sentence-transformers", "open_clip_torch", "faster-whisper", "pillow"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
markers = ["live: hits a real external API; skipped without keys"]
