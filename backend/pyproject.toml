[project]
name = "calypso-backend"
version = "0.1.0"
description = "Calypso⁻¹ backend: memory bank, identity, day builder, recall"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "anthropic>=0.40",
  "httpx>=0.27",
  "numpy>=1.26",
  "redis>=5,<7",      # same ranges as Keanu's RQ worker
  "rq>=2,<3",
  "boto3>=1.35,<2",   # Vultr Object Storage (S3-compatible) for face crops and photos
  "tzdata",           # zoneinfo data on Windows (CALYPSO_TZ)
  "sherpa-onnx>=2,<3",                  # voiceprints: NeMo TitaNet-small (open source, CPU, no PyTorch)
  "opencv-python-headless>=4.10,<5",    # face prints: OpenCV YuNet + SFace (open source)
]

[project.optional-dependencies]
ml = ["sentence-transformers", "open_clip_torch", "faster-whisper", "pillow"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
markers = ["live: hits a real external API; skipped without keys"]
